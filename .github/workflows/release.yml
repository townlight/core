name: Release

on:
  push:
    tags:
      - "v*"
      - "townlight_core-*-freeze"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release tag to rehearse from cold caches"
        required: true
        default: "v1.3.0.dev2"

permissions:
  contents: write
  id-token: write

jobs:
  cleanroom-rehearsal:
    name: cleanroom-rehearsal
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: scott-desktop-cleanroom-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python for direct-pip cleanroom
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cleanroom cache strip (scoped, Townlight-only)
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil

          runner_temp = os.environ["RUNNER_TEMP"]
          for rel in (".npm", ".cache/pip"):
              shutil.rmtree(os.path.join(runner_temp, rel), ignore_errors=True)
          PY
          docker builder prune --all --force --filter "label=townlight-cleanroom=1" || true
          docker network ls --filter "label=townlight-cleanroom=1" -q \
            | xargs -r docker network rm || true
          docker volume ls --filter "label=townlight-cleanroom=1" -q \
            | xargs -r docker volume rm || true

      - name: Install published wheel from release URL
        shell: bash
        run: |
          TAG="${{ inputs.release_tag }}"
          VERSION="${TAG#v}"
          WHEEL_URL="https://github.com/Townlight/townlight_core/releases/download/${TAG}/townlight_core-${VERSION}-py3-none-any.whl"
          echo "Cleanroom wheel URL: ${WHEEL_URL}"
          python -m venv .cleanroom-venv
          . .cleanroom-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --force-reinstall "${WHEEL_URL}"
          TESTING=1 python - <<PY
          import townlight_core
          from townlight_core.ingest import Document, DocumentChunk, compute_file_hash, ingest_file, ingest_bytes, register_handler

          expected = "${VERSION}"
          print(f"townlight_core.__version__={townlight_core.__version__}")
          if townlight_core.__version__ != expected:
              raise SystemExit(f"Expected TownlightCore {expected}, got {townlight_core.__version__}")
          print(
              "townlight_core ingest import ok: "
              f"{Document.__name__}, {DocumentChunk.__name__}, {compute_file_hash.__name__}, "
              f"{ingest_file.__name__}, {ingest_bytes.__name__}, {register_handler.__name__}"
          )
          PY

      - name: Always-run cleanup
        if: always()
        shell: bash
        run: |
          docker compose -p townlight-cleanroom-${{ github.run_id }} down -v --remove-orphans || true
          docker ps -a --filter "label=townlight-cleanroom=1" -q \
            | xargs -r docker container rm --force || true
          docker network ls --filter "label=townlight-cleanroom=1" -q \
            | xargs -r docker network rm || true

  preflight:
    name: Preflight release fixtures
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Verify adversarial release provenance fixtures
        run: python scripts/verify-release-provenance.py --fixtures-dir tests/fixtures/release_provenance

  build:
    name: Build, attest, and verify release candidate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run release verification
        run: bash scripts/verify-release.sh

      - name: Build release artifacts
        run: |
          rm -rf dist build
          python -m build
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Resolve release ref
        id: release_ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref_json="$(gh api "repos/${{ github.repository }}/git/ref/tags/${{ github.ref_name }}")"
          tag_ref_type="$(echo "$ref_json" | python -c "import json,sys; print(json.load(sys.stdin)['object']['type'])")"
          tag_ref_sha="$(echo "$ref_json" | python -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")"
          if [ "$tag_ref_type" = "tag" ]; then
            tag_json="$(gh api "repos/${{ github.repository }}/git/tags/${tag_ref_sha}")"
            target_commit="$(echo "$tag_json" | python -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")"
          else
            target_commit="$tag_ref_sha"
          fi
          target_tree="$(git show -s --format=%T "$target_commit")"
          echo "tag_ref_type=$tag_ref_type" >> "$GITHUB_OUTPUT"
          echo "tag_ref_sha=$tag_ref_sha" >> "$GITHUB_OUTPUT"
          echo "target_commit=$target_commit" >> "$GITHUB_OUTPUT"
          echo "target_tree=$target_tree" >> "$GITHUB_OUTPUT"

      - name: Build release attestation
        run: |
          python scripts/build-release-attestation.py \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --tag-ref-type "${{ steps.release_ref.outputs.tag_ref_type }}" \
            --tag-ref-sha "${{ steps.release_ref.outputs.tag_ref_sha }}" \
            --target-commit "${{ steps.release_ref.outputs.target_commit }}" \
            --target-tree "${{ steps.release_ref.outputs.target_tree }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --artifacts-dir dist \
            --output release-attestation.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign release attestation
        run: cosign sign-blob release-attestation.json --bundle release-attestation.json.bundle --yes

      - name: Verify release attestation before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/verify-release-provenance.py "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --attestation release-attestation.json \
            --bundle release-attestation.json.bundle \
            --artifacts-dir dist \
            --expected-target "${{ steps.release_ref.outputs.target_commit }}" \
            --expected-tree "${{ steps.release_ref.outputs.target_tree }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: townlight_core-dist
          path: |
            dist/*
            release-attestation.json
            release-attestation.json.bundle

  create-draft-release:
    name: Create draft GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: townlight_core-dist
          path: release-assets/

      - name: Create draft GitHub release with wheel + sdist
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_flag=()
          case "${{ github.ref_name }}" in
            townlight_core-*-freeze) latest_flag=(--latest=false) ;;
          esac
          export VERSION="${GITHUB_REF_NAME#v}"
          export REPO="${GITHUB_REPOSITORY}"
          export TAG="${GITHUB_REF_NAME}"
          export WORKFLOW_RUN_ID="${GITHUB_RUN_ID}"
          export WHEEL_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/townlight_core-${VERSION}-py3-none-any.whl"
          export CLEANROOM_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > release-notes.md <<EOF
          TownlightCore ${TAG} release.

          Cleanroom rehearsal: PASSED in workflow run ${WORKFLOW_RUN_ID}.
          Verified clean install of ${WHEEL_URL} from cold caches at ${CLEANROOM_TIMESTAMP}.

          Release provenance:
          - The Git tag is a release pointer; the trust artifact is release-attestation.json plus release-attestation.json.bundle.
          - Pre-flight provenance fixtures and live attestation verification ran before publication in workflow run ${WORKFLOW_RUN_ID}.
          - Historical procurement evidence pack: https://github.com/${REPO}/blob/${GITHUB_SHA}/docs/evidence/co8-civiccore-procurement-evidence-pack/index.md
          - Historical provenance policy: https://github.com/${REPO}/blob/${GITHUB_SHA}/docs/ops/historical-provenance.md
          - Historical CO-9 closeout report: https://github.com/${REPO}/blob/${GITHUB_SHA}/docs/ops/co-9-civiccore-v1-closeout.md
          - Verify with:

          ```bash
          cosign verify-blob release-attestation.json \
            --bundle release-attestation.json.bundle \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          sha256sum -c SHA256SUMS.txt

          python scripts/verify-release-provenance.py ${TAG} \
            --repo ${REPO} \
            --attestation release-attestation.json \
            --bundle release-attestation.json.bundle \
            --artifacts-dir .
          ```
          EOF
          gh release create "${{ github.ref_name }}" \
            --draft \
            release-assets/dist/* \
            release-assets/release-attestation.json \
            release-assets/release-attestation.json.bundle \
            --repo "$GH_REPO" \
            --title "townlight_core ${{ github.ref_name }}" \
            "${latest_flag[@]}" \
            --notes-file release-notes.md

  release-cleanroom-rehearsal:
    name: cleanroom-rehearsal (release asset)
    if: github.event_name == 'push'
    needs: [create-draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: scott-desktop-cleanroom-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python for release-asset cleanroom
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cleanroom cache strip (scoped, Townlight-only)
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil

          runner_temp = os.environ["RUNNER_TEMP"]
          for rel in (".npm", ".cache/pip"):
              shutil.rmtree(os.path.join(runner_temp, rel), ignore_errors=True)
          PY
          docker builder prune --all --force --filter "label=townlight-cleanroom=1" || true
          docker network ls --filter "label=townlight-cleanroom=1" -q \
            | xargs -r docker network rm || true
          docker volume ls --filter "label=townlight-cleanroom=1" -q \
            | xargs -r docker volume rm || true

      - name: Download uploaded wheel from draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .cleanroom-assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern 'townlight_core-*-py3-none-any.whl' \
            --dir .cleanroom-assets
          find .cleanroom-assets -maxdepth 1 -type f -print

      - name: Install uploaded wheel in cleanroom venv
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WHEEL="$(find .cleanroom-assets -name 'townlight_core-*-py3-none-any.whl' -type f | head -1)"
          if [ -z "$WHEEL" ]; then
            echo "::error::No TownlightCore wheel downloaded from draft release."
            exit 1
          fi
          echo "Cleanroom wheel asset: ${WHEEL}"
          python -m venv .cleanroom-venv
          . .cleanroom-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --force-reinstall "${WHEEL}"
          TESTING=1 python - <<PY
          import townlight_core
          from townlight_core.ingest import Document, DocumentChunk, compute_file_hash, ingest_file, ingest_bytes, register_handler

          expected = "${VERSION}"
          print(f"townlight_core.__version__={townlight_core.__version__}")
          if townlight_core.__version__ != expected:
              raise SystemExit(f"Expected TownlightCore {expected}, got {townlight_core.__version__}")
          print(
              "townlight_core ingest import ok: "
              f"{Document.__name__}, {DocumentChunk.__name__}, {compute_file_hash.__name__}, "
              f"{ingest_file.__name__}, {ingest_bytes.__name__}, {register_handler.__name__}"
          )
          PY

      - name: Always-run cleanup
        if: always()
        shell: bash
        run: |
          docker compose -p townlight-cleanroom-${{ github.run_id }} down -v --remove-orphans || true
          docker ps -a --filter "label=townlight-cleanroom=1" -q \
            | xargs -r docker container rm --force || true
          docker network ls --filter "label=townlight-cleanroom=1" -q \
            | xargs -r docker network rm || true

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [release-cleanroom-rehearsal]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release after cleanroom rehearsal
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_flag=()
          case "${{ github.ref_name }}" in
            townlight_core-*-freeze) latest_flag=(--latest=false) ;;
          esac
          gh release edit "${{ github.ref_name }}" \
            --repo "$GH_REPO" \
            --draft=false \
            "${latest_flag[@]}"
