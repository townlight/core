name: townlight_core cleanroom

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cleanroom.yml"
      - "cleanroom/**"
      - "scripts/cleanroom/**"
      - "scripts/run-townlight_core-cleanroom.sh"
      - "townlight_core/release_provenance.py"
      - "tests/fixtures/release_provenance/**"
      - "tests/test_cleanroom_harness.py"
      - "docs/ops/cleanroom-harness.md"
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA to provision inside the cleanroom container
        required: false
        type: string

jobs:
  cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      TARGET_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.commit || github.sha }}
      CLEANROOM_RUN_COUNT: "2"
    steps:
      - name: Check out harness
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify Docker is available
        run: docker version
      - name: Run TownlightCore cleanroom harness
        run: bash scripts/run-townlight_core-cleanroom.sh "$TARGET_COMMIT" "docs/evidence/co6-ci-${TARGET_COMMIT}"
      - name: Upload cleanroom evidence
        uses: actions/upload-artifact@v7
        with:
          name: townlight_core-co6-cleanroom-${{ env.TARGET_COMMIT }}
          path: docs/evidence/co6-ci-${{ env.TARGET_COMMIT }}/
