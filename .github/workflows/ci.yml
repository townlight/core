name: townlight_core CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Docs-only changes start no CI run (docs get push, merge and publish only).
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # code=false only when every changed file is docs. Anything unknown counts as code.
          docs_re='(\.(md|mdx|rst|docx|pdf)$)|(^|/)(LICENSE|NOTICE)(\.[^/]*)?$|^docs/.*\.(png|jpe?g|svg|gif|webp|html|css)$'
          keep_re='(^|/)SKILL\.md$|(^|/)(skills|agents|commands|prompts|references)/|^\.claude/'
          files=""
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') || files=""
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq 'if (.files | length) >= 300 then empty else .files[].filename end') || files=""
          fi
          code=true
          if [ -n "$files" ]; then
            other=$(printf '%s\n' "$files" | grep -Ev "$docs_re" || true)
            kept=$(printf '%s\n' "$files" | grep -E "$docs_re" | grep -E "$keep_re" || true)
            if [ -z "$other" ] && [ -z "$kept" ]; then code=false; fi
          fi
          echo "Changed files:"; printf '%s\n' "$files" | head -50
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify Docker is available
        run: docker version

      - name: Pre-pull pgvector image
        run: docker pull pgvector/pgvector:pg17

      - name: Install townlight_core (editable, dev extras)
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Collect pytest count
        run: |
          set -o pipefail
          python -m pytest tests/ --collect-only -q 2>&1 | tee pytest-collect.log

      - name: Run full release verification
        run: |
          set -o pipefail
          bash scripts/verify-release.sh 2>&1 | tee verify-release.log

      - name: Verify collected == passed or reported skips
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          import sys
          from pathlib import Path

          collect_log = Path("pytest-collect.log").read_text(encoding="utf-8", errors="replace")
          run_log = Path("verify-release.log").read_text(encoding="utf-8", errors="replace")

          collected_matches = re.findall(r"(\d+)\s+tests?\s+collected", collect_log)
          if not collected_matches:
              print("::error::Could not parse pytest collection count from pytest-collect.log.")
              sys.exit(1)
          collected = int(collected_matches[-1])

          summary_matches = re.findall(
              r"=+\s*([^=\n]*\b(?:passed|failed|error|skipped|xfailed|xpassed|deselected)\b[^=\n]*)\s*=+",
              run_log,
          )
          if not summary_matches:
              print("::error::Could not parse pytest result summary from verify-release.log.")
              sys.exit(1)
          summary = summary_matches[0]

          def count(label: str) -> int:
              match = re.search(rf"(\d+)\s+{label}", summary)
              return int(match.group(1)) if match else 0

          passed = count("passed")
          skipped = count("skipped")
          deselected = count("deselected")
          failed = count("failed")
          errors = count("errors?")
          xfailed = count("xfailed")
          xpassed = count("xpassed")
          accounted = passed + skipped + deselected

          print(f"collected={collected}")
          print(f"passed={passed}")
          print(f"skipped={skipped}")
          print(f"deselected={deselected}")
          if failed or errors or xfailed or xpassed:
              print(
                  f"::error::Unexpected pytest non-pass outcomes: failed={failed} "
                  f"errors={errors} xfailed={xfailed} xpassed={xpassed}."
              )
              sys.exit(1)
          if collected != accounted:
              print(
                  f"::error::Collection/run mismatch: collected={collected} "
                  f"accounted={accounted} passed={passed} skipped={skipped} deselected={deselected}."
              )
              print("::error::Investigate silent test loss, early exit, or unreported pytest outcomes.")
              sys.exit(1)
          if collected != passed:
              print(
                  f"::notice::Collected count differs from passed only by reported skips/deselections "
                  f"(skipped={skipped}, deselected={deselected})."
              )
          PY

      - name: Accessibility gate (no browser surface)
        run: |
          echo "TownlightCore exposes shared backend contracts and has no operator-facing browser surface in this repo."
          echo "Per-PR axe gates run in TownlightRecords, TownlightMeetings, TownlightCode, and the Townlight launcher."
