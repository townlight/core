name: Windows component contracts
on:
  pull_request:
    paths: ["**/*.py", "**/*.toml", "**/*.sql", "**/*.json", "**/*.ini", "**/*.cfg", "**/*.ps1", "**/*.sh", "**/*.yaml", "**/*.yml", "**/requirements*.txt", "**/*.lock"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - name: Install component and test tools
        run: python -m pip install -e ".[dev]" pytest
      - name: Prepare isolated native PostgreSQL fixture
        shell: pwsh
        run: ./.github/scripts/prepare-windows-test-db.ps1 -WithVector
      - name: Run full Python suite on Windows
        run: python -X utf8 -m pytest tests -q -ra --junitxml=windows-contracts.xml
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-contract-results
          path: ./windows-contracts.xml
          retention-days: 7
      - name: Stop owned test database
        if: always()
        shell: pwsh
        run: |
          $cluster = Join-Path $env:RUNNER_TEMP 'townlight-test-pg'
          if (Test-Path (Join-Path $cluster 'postmaster.pid')) {
            & "$env:PGBIN/pg_ctl.exe" -D $cluster -m fast -w stop
            if ($LASTEXITCODE -ne 0) { throw 'Owned test database did not stop.' }
          }
